spring:
  mvc:
    problemdetails:
      enabled: true
  application:
    name: user-service
  rabbitmq:
    host: "${RABBIT_BROKER_HOST:localhost}"
    port: "${RABBIT_BROKER_PORT:5672}"
    username: "${RABBIT_BROKER_USER:rabbit}"
    password: "${RABBIT_BROKER_PASSWORD:rabbit}"
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
  datasource:
    url: jdbc:h2:mem:user;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    hibernate:
      ddl-auto: update
    open-in-view: false
server:
  port: "${USER_SERVICE_PORT:8083}"
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      access: read_only
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true