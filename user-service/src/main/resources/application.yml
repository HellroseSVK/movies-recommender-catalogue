spring:
  mvc:
    problemdetails:
      enabled: true
  application:
    name: user-service
  rabbitmq:
    host: "${RABBIT_BROKER_HOST:localhost}"
    port: "${RABBIT_BROKER_PORT:5672}"
    username: "${RABBIT_BROKER_USER:rabbit}"
    password: "${RABBIT_BROKER_PASSWORD:rabbit}"
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
  datasource:
    url: jdbc:h2:mem:user;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    hibernate:
      ddl-auto: update
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        opaque-token:
          introspection-uri: https://id.muni.cz/oidc/introspect
          # Martin Kuba's testing resource server
          client-id: d57b3a8f-156e-46de-9f27-39c4daee05e1
          client-secret: fa228ebc-4d54-4cda-901e-4d6287f8b1652a9c9c44-73c9-4502-973f-bcdb4a8ec96a
springdoc:
  swagger-ui:
    oauth2-redirect-url: http://localhost:8083/login/oauth2/code/muni
    path: /swagger-ui.html
    oauth:
      # Martin Kuba's testing client
      client-id: 7e02a0a9-446a-412d-ad2b-90add47b0fdd
      client-secret: 48a2b2e3-4b2b-471e-b7b7-b81a85b6eeef22f347f2-3fc9-4e16-8698-3e2492701a89
      scopes:
        - openid
        - test_read
        - test_write
        - test_1
        - test_2
server:
  port: "${USER_SERVICE_PORT:8083}"
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      access: read_only
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true