global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'spring-boot-services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'movie-service:8081'
          - 'film-person-service:8082'
          - 'feedback-service:8083'
          - 'recommendation-service:8084'