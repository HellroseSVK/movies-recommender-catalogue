image: maven:3.9.6-eclipse-temurin-21-alpine

stages:
  - build
  - test

default:
  tags:
    - shared-fi

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

build:
  stage: build
  script:
    - echo "Building the project..."
    - mvn clean $MAVEN_CLI_OPTS -DskipTests package

test:
    stage: test
    script:
        - mvn $MAVEN_CLI_OPTS test
    dependencies:
        - build
    artifacts:
      when: always
      reports:
        junit: # GitLab understands this format
          - feedback-service/target/surefire-reports/*.xml
          - film-person-service/target/surefire-reports/*.xml
          - movie-service/target/surefire-reports/*.xml
          - recommendation-service/target/surefire-reports/*.xml
          - user-service/target/surefire-reports/*.xml
      paths:
        - feedback-service/target/surefire-reports/
        - film-person-service/target/surefire-reports/
        - movie-service/target/surefire-reports/
        - recommendation-service/target/surefire-reports/
        - user-service/target/surefire-reports/