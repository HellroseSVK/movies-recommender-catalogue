image: openjdk:21-jdk-slim

stages:
  - build
  - test

default:
  tags:
    - shared-fi

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

build:
  stage: build
  script:
    - echo "Building the project..."
    - mvn clean $MAVEN_CLI_OPTS -DskipTests package

test:
    stage: test
    script:
        - mvn $MAVEN_CLI_OPTS test
    dependencies:
        - build