services:
  movie-service:
    build:
      context: ./
      dockerfile: ./movie-service/Dockerfile
    ports:
      - "8081:8081"
    volumes:
      - ./config/movie/external-app.properties:/app/etc/application.properties
    env_file: ./etc/dev.env

  film-person-service:
    build:
      context: ./
      dockerfile: ./film-person-service/Dockerfile
    ports:
      - "8082:8082"
    volumes:
      - ./config/film-person/external-app.properties:/app/etc/application.properties
    env_file: ./etc/dev.env

  user-service:
    build:
      context: ./
      dockerfile: ./user-service/Dockerfile
    ports:
      - "8083:8083"
    volumes:
      - ./config/user/external-app.properties:/app/etc/application.properties
    env_file: ./etc/dev.env

  feedback-service:
    build:
      context: ./
      dockerfile: ./feedback-service/Dockerfile
    ports:
      - "8084:8084"
    volumes:
      - ./config/feedback/external-app.properties:/app/etc/application.properties
    env_file: ./etc/dev.env

  recommendation-service:
    build:
      context: ./
      dockerfile: ./recommendation-service/Dockerfile
    ports:
      - "8085:8085"
    volumes:
      - ./config/recommendation/external-app.properties:/app/etc/application.properties
    env_file: ./etc/dev.env

