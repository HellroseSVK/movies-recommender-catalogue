version: '3.9'
services:
  movie-service:
    build: ./movie-service
    ports:
      - "8081:8080"
    volumes:
      - ./config/movie/external-app.properties:/app/etc/application.properties

  film-person-service:
    build: ./film-person-service
    ports:
      - "8082:8080"
    volumes:
      - ./config/film-person/external-app.properties:/app/etc/application.properties

  user-service:
    build: ./user-service
    ports:
      - "8083:8080"
    volumes:
      - ./config/user/external-app.properties:/app/etc/application.properties

  feedback-service:
    build: ./feedback-service
    ports:
      - "8084:8080"
    volumes:
      - ./config/feedback/external-app.properties:/app/etc/application.properties

  recommendation-service:
    build: ./recommendation-service
    ports:
      - "8085:8080"
    volumes:
      - ./config/recommendation/external-app.properties:/app/etc/application.properties

  artemis:
    image: apache/activemq-artemis:latest
    container_name: artemis-broker
    environment:
      - ARTEMIS_USERNAME=artemis
      - ARTEMIS_PASSWORD=artemis
      - DISABLE_SECURITY=true
    ports:
      - "61616:61616"  # JMS port
      - "8161:8161"    # Web console
    volumes:
      - artemis-data:/var/lib/artemis/data
