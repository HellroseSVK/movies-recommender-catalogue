services:
  movie-service:
    build:
      context: ./
      dockerfile: ./movie-service/Dockerfile
    ports:
      - "8081:8081"
    volumes:
      - ./config/movie/external-application.yml:/app/application.yaml
    env_file: ./etc/dev.env

  film-person-service:
    build:
      context: ./
      dockerfile: ./film-person-service/Dockerfile
    ports:
      - "8082:8082"
    volumes:
      - ./config/film-person/external-application.yml:/app/application.yaml
    env_file: ./etc/dev.env

  user-service:
    build:
      context: ./
      dockerfile: ./user-service/Dockerfile
    ports:
      - "8083:8083"
    volumes:
      - ./config/user/external-application.yml:/app/application.yaml
    env_file: ./etc/dev.env

  feedback-service:
    build:
      context: ./
      dockerfile: ./feedback-service/Dockerfile
    ports:
      - "8084:8084"
    volumes:
      - ./config/feedback/external-application.yml:/app/application.yaml
    env_file: ./etc/dev.env

  recommendation-service:
    build:
      context: ./
      dockerfile: ./recommendation-service/Dockerfile
    ports:
      - "8085:8085"
    volumes:
      - ./config/recommendation/external-application.yml:/app/application.yaml
    env_file: ./etc/dev.env

  artemis:
    image: apache/activemq-artemis:latest
    container_name: artemis-broker
    environment:
      - ARTEMIS_USERNAME=artemis
      - ARTEMIS_PASSWORD=artemis
      - DISABLE_SECURITY=true
    ports:
      - "61616:61616"  # JMS port
      - "8161:8161"    # Artemis Web console: http://localhost:8161
    volumes:
      - artemis-data:/var/lib/artemis/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: local-rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # RabbitMQ Management console: http://localhost:15672
    environment:
      RABBITMQ_DEFAULT_USER: rabbit
      RABBITMQ_DEFAULT_PASS: rabbit

  prometheus:
    image: bitnami/prometheus:3.3.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus-storage:/opt/bitnami/prometheus/data
      - ./etc/prometheus.yml:/opt/bitnami/prometheus/conf/prometheus.yml
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.0.0
    container_name: grafana
    ports:
      - "3000:3000" # Grafana console: http://localhost:3000 (user: admin, pass: admin)
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./etc/grafana:/etc/grafana/provisioning
    restart: unless-stopped

volumes:
  artemis-data:
  prometheus-storage:
  grafana-storage:

