services:
  movie-service:
    build:
      context: ./
      dockerfile: ./movie-service/Dockerfile
    ports:
      - "8081:8081"
    volumes:
      - ./config/movie/external-application.yml:/app/application.yaml
    env_file: ./etc/dev.env

  film-person-service:
    build:
      context: ./
      dockerfile: ./film-person-service/Dockerfile
    ports:
      - "8082:8082"
    volumes:
      - ./config/film-person/external-application.yml:/app/application.yaml
    env_file: ./etc/dev.env

  user-service:
    build:
      context: ./
      dockerfile: ./user-service/Dockerfile
    ports:
      - "8083:8083"
    volumes:
      - ./config/user/external-application.yml:/app/application.yaml
    env_file: ./etc/dev.env

  feedback-service:
    build:
      context: ./
      dockerfile: ./feedback-service/Dockerfile
    ports:
      - "8084:8084"
    volumes:
      - ./config/feedback/external-application.yml:/app/application.yaml
    env_file: ./etc/dev.env

  recommendation-service:
    build:
      context: ./
      dockerfile: ./recommendation-service/Dockerfile
    ports:
      - "8085:8085"
    volumes:
      - ./config/recommendation/external-application.yml:/app/application.yaml
    env_file: ./etc/dev.env

  rabbitmq:
    image: rabbitmq:3-management
    container_name: local-rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # RabbitMQ Management console: http://localhost:15672
    environment:
      RABBITMQ_DEFAULT_USER: rabbit
      RABBITMQ_DEFAULT_PASS: rabbit

