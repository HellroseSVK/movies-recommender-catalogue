spring:
  mvc:
    problemdetails:
      enabled: true
  application:
    name: film-person-service
  rabbitmq:
    host: "${RABBIT_BROKER_HOST:localhost}"
    port: "${RABBIT_BROKER_PORT:5672}"
    username: "${RABBIT_BROKER_USER:rabbit}"
    password: "${RABBIT_BROKER_PASSWORD:rabbit}"
server:
  port: "${FILM_PERSON_SERVICE_PORT:8082}"
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      access: read_only
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
