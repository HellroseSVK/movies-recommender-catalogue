spring:
  mvc:
    problemdetails:
      enabled: true
  application:
    name: recommendation-service
  artemis:
    broker-url: "${ACTIVEMQ_BROKER_URL:tcp://localhost:61616}"
    user: "${ACTIVEMQ_USER:artemis}"
    password: "${ACTIVEMQ_PASS:artemis}"
    mode: native
  rabbitmq:
    host: "${RABBIT_BROKER_HOST:localhost}"
    port: "${RABBIT_BROKER_PORT:5672}"
    username: "${RABBIT_BROKER_USER:rabbit}"
    password: "${RABBIT_BROKER_PASSWORD:rabbit}"
server:
  port: "${RECOMMENDATION_SERVICE_PORT:8085}"