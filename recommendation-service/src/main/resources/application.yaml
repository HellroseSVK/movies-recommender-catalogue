spring:
  mvc:
    problemdetails:
      enabled: true
  application:
    name: recommendation-service
  artemis:
    broker-url: "${ACTIVEMQ_BROKER_URL:tcp://localhost:61616}"
    user: "${ACTIVEMQ_USER:artemis}"
    password: "${ACTIVEMQ_PASS:artemis}"
    mode: native
  rabbitmq:
    host: "${RABBIT_BROKER_HOST:localhost}"
    port: "${RABBIT_BROKER_PORT:5672}"
    username: "${RABBIT_BROKER_USER:rabbit}"
    password: "${RABBIT_BROKER_PASSWORD:rabbit}"
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
  datasource:
    url: jdbc:h2:mem:movie-recommendation;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    hibernate:
      ddl-auto: update
    open-in-view: false
batch:
  size: 50 # Number of records to process in a single batch
  timeout-ms: 500 # Timeout between messages for batch processing in milliseconds
server:
  port: "${RECOMMENDATION_SERVICE_PORT:8085}"